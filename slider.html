<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>make the puppy pretty!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="image-box">
    <img id="dog" src="assets/dog.jpg" alt="happy puppy with tongue halfway sticking out">
    
    <img id="dahlia" src="assets/dahlia.png" alt="dahlia/orange flower image">
    <img id="circle" src="assets/circle.png" alt=" a black circle">
    <img id="pink" src="assets/pink.png" alt="pink almost sakura like flower">
    
    <p id="overlay-text">puppy</p>
  </div>

  <div class="controls">
    <h3>transform puppy</h3>
    <label>Rotate:</label>
    <input id="rotate" type="range" min="-180" max="180" value="0">

    <label>Skew X:</label>
    <input id="skewX" type="range" min="-45" max="45" value="0">

    <label>Skew Y:</label>
    <input id="skewY" type="range" min="-45" max="45" value="0">

    <label>Scale:</label>
    <input id="scale" type="range" min="0.5" max="2" step="0.1" value="1">

    <hr>

    <h3>text</h3>
    <label>Text:</label>
    <input id="textInput" type="text" value="puppy">

    <label>Color:</label>
    <input id="textColor" type="color" value="#ffffff">

    <label>Text X Position:</label>
    <input id="textX" type="range" min="0" max="500" value="30">

    <label>Text Y Position:</label>
    <input id="textY" type="range" min="0" max="400" value="30">

    <hr>

    <h3>transform flower</h3>
    <label>Dahlia X Position:</label>
    <input id="dahliaX" type="range" min="0" max="500" value="250">

    <label>Dahlia Y Position:</label>
    <input id="dahliaY" type="range" min="0" max="400" value="50">

    <hr>

    <h3>transform circle</h3>
    <label>Circle X Position:</label>
    <input id="circleX" type="range" min="0" max="500" value="100">

    <label>Circle Y Position:</label>
    <input id="circleY" type="range" min="0" max="400" value="150">

    <hr>

    <h3>transform pink flower</h3>
    <label>Pink X Position:</label>
    <input id="pinkX" type="range" min="0" max="500" value="400">

    <label>Pink Y Position:</label>
    <input id="pinkY" type="range" min="0" max="400" value="200">
  </div>

  <script src="script.js"></script>
</body>
</html>
