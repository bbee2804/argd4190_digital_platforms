<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michelle's Library!</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lacquer&display=swap" rel="stylesheet">

  <style>
    :root {
       --fs-xl: clamp(4rem, 10vw, 9rem);
       --fs-lg: clamp(3rem, 7vw, 6rem);
       --fs-md: clamp(2rem, 5vw, 4rem);
       --fs-sm: clamp(1.5rem, 3vw, 2.5rem);
    }

    body {
       background-color: #f8a9a9;
       margin: 0;
       padding: 40px;
       font-family: sans-serif;
    }

    #biggest {
       font-family: "Lacquer", system-ui, cursive;
       font-size: var(--fs-xl);
       color: rgb(201, 80, 120);
       margin: 0 0 20px 0;
       line-height: 1.1;
    }

    .filter-bar {
       margin-bottom: 30px;
       font-family: "Krub", sans-serif;
    }

    .filter-bar select {
       padding: 8px 12px;
       border-radius: 6px;
       border: 1px solid rgb(211, 122, 128);
       background-color: rgb(241, 200, 200);
       color: rgb(193, 47, 96);
       font-size: 1rem;
    }

    .collection-grid {
       display: grid;
       grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
       gap: 30px;
       width: 100%;
       max-width: 1200px;
       margin: 0 auto;
    }

    .card {
       background-color: rgb(241, 200, 200);
       border: 1px dashed pink;
       border-radius: 12px;
       padding: 20px;
       display: flex;
       flex-direction: column;
       align-items: center;
       text-align: center;
       box-sizing: border-box;
       transition: 0.2s ease;
    }

    .card:hover {
       background-color: rgb(255, 215, 215);
       transform: rotate(-1deg) scale(1.02);
    }

    .card-image {
       width: 100%;
       height: 280px;
       object-fit: contain;
       margin: 15px 0;
       border-radius: 6px;
       display: block;
    }

    .card-title {
       font-family: "Krub", sans-serif;
       font-size: 1.2rem;
       font-weight: 700;
       color: rgb(193, 47, 96);
       margin-bottom: 5px;
    }

    .card-author {
       font-family: "Krub", sans-serif;
       font-size: 1rem;
       color: rgb(211, 122, 128);
       margin-bottom: 5px;
    }

    .card-genre {
       font-family: "Krub", sans-serif;
       font-size: 0.85rem;
       text-transform: uppercase;
       letter-spacing: 0.5px;
       color: rgb(235, 40, 122);
       margin-top: auto;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 id="biggest">Michelle's Library! ❀༉</h1>
  </header>

  <div class="filter-bar">
    <label for="genreSelect">Filter by Genre: </label>
    <select id="genreSelect">
      <option value="all">All Genres</option>
    </select>
  </div>

  <div class="collection-grid" id="bookGrid"></div>

  <script src="script.js"></script>
</body>
</html>
